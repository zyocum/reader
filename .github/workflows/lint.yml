name: lint

on:
    push:
        branches: [master]
    pull_request:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.0.1
            - name: Install dependencies (locked)
              run: uv sync --locked
            - name: ruff
              run: uv run ruff check --output-format=github .
            - name: basedpyright
              run: uv run basedpyright
